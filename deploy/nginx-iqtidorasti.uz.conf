# /etc/nginx/sites-available/iqtidorasti.uz
# SSL (443) qismini certbot o'zi qo'shadi: certbot --nginx -d iqtidorasti.uz -d www.iqtidorasti.uz --redirect

upstream iqtidorasti_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name iqtidorasti.uz www.iqtidorasti.uz;

    # www.iqtidorasti.uz -> iqtidorasti.uz
    if ($host = www.iqtidorasti.uz) {
        return 301 https://iqtidorasti.uz$request_uri;
    }

    # So'rovnomaga fayl yuklash: bitta yuborishda 100 MB gacha
    client_max_body_size 105m;
    client_body_timeout 180s;

    location /static/ {
        alias /srv/iqtidorasti/app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ommaviy rasmlar: logotip, mas'ul shaxs rasmi, avatar, post va mukofot rasmlari
    location ~ ^/media/(institutions|avatars|posts|sponsors|rewards)/ {
        root /srv/iqtidorasti/app/backend;
        expires 7d;
        access_log off;
    }

    # Qolgan fayllar (yutuq hujjatlari) ruxsat tekshiradigan Django orqali
    location / {
        proxy_pass http://iqtidorasti_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_redirect off;
    }
}
