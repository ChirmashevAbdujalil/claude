{% if field.widget_type == "checkbox" %}
<label class="check">{{ field }} {{ field.label }}</label>
{% else %}
<div class="field {% if field.errors %}has-error{% endif %}">
  {% if field.label %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted" style="font-weight:500">(ixtiyoriy)</span>{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
</div>
{% endif %}
