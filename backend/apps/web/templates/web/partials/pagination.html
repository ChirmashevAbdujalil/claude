{% if page.has_other_pages %}
<nav class="pagination" aria-label="Sahifalar">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Oldingi</a>{% endif %}
  <span class="btn btn-sm disabled" style="opacity:1">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Keyingi →</a>{% endif %}
</nav>
{% endif %}
