{% if form.non_field_errors %}
<div class="form-errors">{% for error in form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>
{% endif %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
{% for field in form.visible_fields %}{% include "web/partials/field.html" %}{% endfor %}
