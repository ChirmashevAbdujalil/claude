{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Iqtidorlar platformasi{% endblock %} · ADTI Talent Hub</title>
  <meta name="description" content="{% block description %}Andijon davlat texnika instituti iqtidorli talabalarini kashf qiluvchi va rivojlantiruvchi platforma{% endblock %}">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23c026d3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 14l5 11 12 1-9 8 3 12-11-7-11 7 3-12-9-8 12-1z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-authenticated="{{ user.is_authenticated|yesno:'1,0' }}"
      data-telegram-login="{% url 'web:telegram-login' %}"
      data-next="{{ request.GET.next|default:'' }}">
  {% include "web/partials/icons.html" %}
  {% include "web/partials/messages.html" %}
  {% block body %}{% endblock %}
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  {% block scripts %}{% endblock %}
  <script src="{% static 'web/js/app.js' %}"></script>
</body>
</html>
