{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Iqtidorlar platformasi{% endblock %} · ADTI Talent Hub</title>
  <meta name="description" content="{% block description %}Andijon davlat texnika instituti iqtidorli talabalarini kashf qiluvchi va rivojlantiruvchi platforma{% endblock %}">
  <meta name="theme-color" content="#062d3b">
  <script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'web/img/adti-logo-32.png' %}">
  <link rel="icon" type="image/png" sizes="64x64" href="{% static 'web/img/adti-logo-64.png' %}">
  <link rel="apple-touch-icon" href="{% static 'web/img/apple-touch-icon.png' %}">
  <meta property="og:image" content="{% static 'web/img/adti-logo-512.webp' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-authenticated="{{ user.is_authenticated|yesno:'1,0' }}"
      data-telegram-login="{% url 'web:telegram-login' %}"
      data-next="{{ request.GET.next|default:'' }}">
  {% include "web/partials/icons.html" %}
  {% include "web/partials/messages.html" %}
  {% block body %}{% endblock %}
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  {% block scripts %}{% endblock %}
  <script src="{% static 'web/js/app.js' %}"></script>
</body>
</html>
