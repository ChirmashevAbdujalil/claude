services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talenthub
      POSTGRES_USER: talenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env faylida belgilang}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talenthub"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_DB: talenthub
      POSTGRES_USER: talenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    volumes:
      - media:/app/media
      - private_media:/app/private_media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  private_media:
